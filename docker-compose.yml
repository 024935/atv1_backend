services:
  api:
    build: .
    environment:
      APP_PORT: 3589
      DB_DRIVER: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: devshowcase
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "3589:3589"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: devshowcase,devshowcase_test
    ports:
      - "5434:5432"
    volumes:
      - devshowcase_pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devshowcase_pgdata:
